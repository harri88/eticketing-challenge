name: Production Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service: 
          - name: backend-dotnet-tickets
            context: ./backend-dotnet-tickets
          - name: backend-go-payment
            context: ./backend-go-payment
          - name: backend-python-ledger
            context: ./backend-python-ledger
          - name: frontend-react
            context: ./frontend-react
          - name: frontend-backoffice
            context: ./frontend-backoffice

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repo Owner
        id: owner_lower
        run: |
          echo "owner_lower=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.owner_lower.outputs.owner_lower }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REACT_APP_API_URL=http://${{ secrets.EC2_HOST }}:5020
            REACT_APP_TICKET_SERVICE=http://${{ secrets.EC2_HOST }}:5020
            REACT_APP_PAYMENT_SERVICE=http://${{ secrets.EC2_HOST }}:8081
            REACT_APP_LEDGER_SERVICE=http://${{ secrets.EC2_HOST }}:8000

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (for compose file)
        uses: actions/checkout@v4

      - name: Lowercase Repo Owner
        id: owner_lower
        run: |
          echo "owner_lower=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Copy Compose File & Scripts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml,sql_scripts"
          target: "/home/${{ secrets.EC2_USER }}/eticketing_deploy"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to deploy folder
            cd /home/${{ secrets.EC2_USER }}/eticketing_deploy

            # Export Environment Variables used in docker-compose.prod.yml
            export GITHUB_REPOSITORY_OWNER=${{ steps.owner_lower.outputs.owner_lower }}
            
            # NOTE: Ensure your EC2 can pull from GHCR. 
            # If your packages are private, you need to run `docker login ghcr.io -u USER -p TOKEN` once on the server.
            
            # Pull latest images
            docker compose -f docker-compose.prod.yml pull

            # Restart services
            # Remove orphans to clean up
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Prune old images to save space
            docker image prune -f

