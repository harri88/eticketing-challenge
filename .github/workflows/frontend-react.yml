name: Frontend React CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'frontend-react/**'
      - '.github/workflows/frontend-react.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'frontend-react/**'
      - '.github/workflows/frontend-react.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-react

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: frontend-react/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Test
      run: npm test -- --watchAll=false --passWithNoTests

    - name: Build
      run: npm run build
      env:
        CI: false # Treat warnings as warnings, not errors

    - name: Docker Build
      run: |
        docker build --build-arg REACT_APP_API_URL=http://localhost:5020 -t frontend-react .
