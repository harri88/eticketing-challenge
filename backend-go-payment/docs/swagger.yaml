basePath: /
definitions:
  domain.PaymentRequest:
    properties:
      amount:
        type: number
      currency:
        type: string
      order_id:
        type: string
      payment_method:
        description: credit_card, qr_scan, crypto
        type: string
    required:
    - amount
    - order_id
    - payment_method
    type: object
  domain.Transaction:
    properties:
      amount:
        type: number
      created_at:
        type: string
      currency:
        type: string
      id:
        type: integer
      order_id:
        type: string
      payment_method:
        type: string
      payment_ref:
        type: string
      status:
        description: PENDING, SUCCESS, FAILED
        type: string
      transaction_id:
        description: e.g., TXN-CC-17000
        type: string
    type: object
host: localhost:8081
info:
  contact:
    name: API Support
  description: Payment processing service for e-ticketing platform
  license:
    name: Apache 2.0
  termsOfService: http://swagger.io/terms/
  title: Payment Service API
  version: "1.0"
paths:
  /api/v1/payments:
    post:
      consumes:
      - application/json
      description: Process a payment transaction for an order
      parameters:
      - description: Payment Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.PaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Make Payment
      tags:
      - payments
swagger: "2.0"
