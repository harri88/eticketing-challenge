basePath: /
definitions:
  domain.PaymentRequest:
    properties:
      amount:
        description: |-
          Payment amount
          required: true
          minimum: 0.01
          example: 250.50
        type: number
      card_cvc:
        description: |-
          Credit card CVC (for credit_card method)
          example: 123
        type: string
      card_expiry:
        description: |-
          Credit card expiry date MM/YY (for credit_card method)
          example: 12/25
        type: string
      card_number:
        description: |-
          Credit card number (for credit_card method)
          example: 4242424242424242
        type: string
      order_id:
        description: |-
          Order ID - unique identifier for the order
          required: true
          example: order-12345
        type: string
      payment_method:
        description: |-
          Payment method - credit_card, qr_scan, or crypto
          required: true
          enum: credit_card,qr_scan,crypto
          example: credit_card
        type: string
    required:
    - amount
    - order_id
    - payment_method
    type: object
  domain.Transaction:
    properties:
      amount:
        description: |-
          Transaction amount
          example: 250.50
        type: number
      created_at:
        description: |-
          Timestamp when transaction was created
          example: 2026-01-25T10:30:00Z
        type: string
      currency:
        description: |-
          Currency code
          example: AED
        type: string
      id:
        description: |-
          Database ID
          example: 1
        type: integer
      order_id:
        description: |-
          Associated order ID
          example: order-12345
        type: string
      payment_method:
        description: |-
          Payment method used
          enum: credit_card,qr_scan,crypto
          example: credit_card
        type: string
      payment_ref:
        description: |-
          External payment gateway reference
          example: ch_1234567890
        type: string
      status:
        description: |-
          Transaction status
          enum: PENDING,SUCCESS,FAILED
          example: SUCCESS
        type: string
      transaction_id:
        description: |-
          Unique transaction identifier
          example: TXN-CC-17000
        type: string
    type: object
host: localhost:8081
info:
  contact:
    name: API Support
  description: Payment processing service for e-ticketing platform
  license:
    name: Apache 2.0
  termsOfService: http://swagger.io/terms/
  title: Payment Service API
  version: "1.0"
paths:
  /api/v1/payments:
    post:
      consumes:
      - application/json
      description: Process a payment transaction for an order
      parameters:
      - description: Payment Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.PaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Transaction'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Make Payment
      tags:
      - payments
swagger: "2.0"
