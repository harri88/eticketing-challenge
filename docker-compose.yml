services:
  # Database for .NET Ticket Service
  ticket-db:
    image: postgres:15-alpine
    container_name: ticket_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres@12345
      POSTGRES_DB: ticket_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_ticket:/var/lib/postgresql/data
      - ./sql_scripts/init_ticket.sql:/docker-entrypoint-initdb.d/init_ticket.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:  # <--- ADDED THIS
      - ticketing-network

  # Database for Go Payment Service
  payment-db:
    image: postgres:15-alpine
    container_name: payment_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres@12345
      POSTGRES_DB: payment_db
    ports:
      - "5433:5432" # Host port 5433 maps to container port 5432
    volumes:
      - postgres_data_payment:/var/lib/postgresql/data
      - ./sql_scripts/init_payment.sql:/docker-entrypoint-initdb.d/init_payment.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:  # <--- ADDED THIS
      - ticketing-network

  # Database for Python Ledger Service
  ledger-db:
    image: postgres:15-alpine
    container_name: ledger_postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres@12345
      POSTGRES_DB: ledger_db
    ports:
      - "5434:5432" # Host port 5434 maps to container port 5432
    volumes:
      - postgres_data_ledger:/var/lib/postgresql/data
      - ./sql_scripts/init_ledger.sql:/docker-entrypoint-initdb.d/init_ledger.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:  # <--- ADDED THIS
      - ticketing-network

  # # --- Application Services ---

  backend-dotnet-tickets:
    build: ./backend-dotnet-tickets
    container_name: backend_dotnet_tickets
    ports:
      - "5020:5020"
    depends_on:
      ticket-db:
        condition: service_healthy
    environment:
      # Note: Port is 5432 because we are talking inside the docker network
      ConnectionStrings__DefaultConnection: "Host=ticket-db;Port=5432;Database=ticket_db;Username=postgres;Password=postgres@12345"
    networks:
      - ticketing-network

  backend-go-payment:
    build:
      context: ./backend-go-payment
    container_name: backend_go_payment
    ports:
      - "8081:8081"
    depends_on:
      payment-db:
        condition: service_healthy  # <--- CHANGED from service_started
    environment:
      ENVIRONMENT: development
      DB_HOST: payment-db
      DB_PORT: 5432 # Internal port is always 5432
      DB_USER: postgres
      DB_PASSWORD: postgres@12345
      DB_NAME: payment_db
      TICKET_SERVICE_URL: http://backend-dotnet-tickets:5020
      LEDGER_SERVICE_URL: http://backend-python-ledger:8000
      PAYMENT_GATEWAY_PROVIDER: stripe
    networks:
      - ticketing-network

  backend-python-ledger:
    build: ./backend-python-ledger
    container_name: backend_python_ledger
    ports:
      - "8000:8000"
    depends_on:
      ledger-db:
        condition: service_healthy  # <--- CHANGED from service_started
    environment:
      # CHANGED: Encoded the '@' in password to '%40' to avoid parsing errors
      DATABASE_URL: "postgresql://postgres:postgres%4012345@ledger-db:5432/ledger_db"
    networks:
      - ticketing-network

  # --- Frontend Services ---

  frontend-react:
    build:
      context: ./frontend-react
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL}
    container_name: frontend_react
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL}
    depends_on:
      - backend-dotnet-tickets
    networks:
      - ticketing-network

  frontend-backoffice:
    build:
      context: ./frontend-backoffice
      args:
        REACT_APP_TICKET_SERVICE: ${REACT_APP_API_URL}
        REACT_APP_PAYMENT_SERVICE: ${PAYMENT_API_URL}
        REACT_APP_LEDGER_SERVICE: ${LEDGER_API_URL}
    container_name: frontend_backoffice
    ports:
      - "3001:3000"
    environment:
      # Use same public URL for all services if they are served via reverse proxy on same host
      # Or specific ports if exposed directly
      REACT_APP_TICKET_SERVICE: ${REACT_APP_API_URL} 
      REACT_APP_PAYMENT_SERVICE: ${PAYMENT_API_URL}
      REACT_APP_LEDGER_SERVICE: ${LEDGER_API_URL}
    depends_on:
      - backend-dotnet-tickets
      - backend-go-payment
      - backend-python-ledger
    networks:
      - ticketing-network

networks:
  ticketing-network:
    driver: bridge

volumes:
  postgres_data_ticket:
    driver: local
  postgres_data_payment:
    driver: local
  postgres_data_ledger:
    driver: local